name: Testing automatic building
run-name: petclinic deployment
on: [push]
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - run: pwd
      - run: cd ..
      - run: pwd
      - run: cd ..
      - run: pwd
      - run: cd ..
      - run: pwd
      - run: mvn clean
      - run: mvn package
